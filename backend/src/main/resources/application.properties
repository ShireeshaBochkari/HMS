# Hostel Management System configuration
spring.application.name=hostel-management

# ---- Database ----
# Railway MySQL plugin exposes MYSQLHOST / MYSQLPORT / MYSQLDATABASE / MYSQLUSER / MYSQLPASSWORD.
# Add them to this service as references (see DEPLOYMENT_GUIDE.md) and the app connects automatically.
# SPRING_DATASOURCE_* still override everything if you prefer a full JDBC URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:hostel_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Small pool + retry-friendly settings so the app tolerates a slow-starting DB
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1

# Schema is created/updated automatically. Consider Flyway/Liquibase for controlled migrations later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ---- Server ----
# Railway injects PORT; local development defaults to 8080.
server.port=${PORT:8080}
server.address=0.0.0.0
# Railway terminates HTTPS at its proxy
server.forward-headers-strategy=framework
server.shutdown=graceful

# ---- Security ----
# Always set JWT_SECRET (Base64, 32+ bytes) in Railway. The fallback is for local development only.
jwt.secret=${JWT_SECRET:VGVzdC1vbmx5LWRldi1zZWNyZXQtZG9ub3QtdXNlLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of allowed browser origins. "*" is fine when the frontend is served by this same service.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Demo accounts and sample records are opt-in in deployed environments.
app.seed-demo-data=${SEED_DEMO_DATA:false}

# An initial warden can be provisioned without opening owner registration to the public.
app.bootstrap-warden.email=${INITIAL_WARDEN_EMAIL:}
app.bootstrap-warden.password=${INITIAL_WARDEN_PASSWORD:}
app.bootstrap-warden.name=${INITIAL_WARDEN_NAME:Hostel Warden}

logging.level.org.springframework.security=INFO
logging.level.com.hostel.hostel_management=INFO
